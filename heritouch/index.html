<script>
class DCLogic {
  constructor() { this.props = {"gold": "#C9A45C", "accent": "#C0281E", "ink": "#C9A45C", "fluid": true, "multicolor": true, "distortion": 0.07, "titleBlend": "difference", "trail": 0.6, "ambient": true, "titleGlow": true}; this.state = {}; }
  setState(o) { Object.assign(this.state, o); if (this.onState) this.onState(); }
}
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.m = { x: .5, y: .5, sx: .5, sy: .5, px: .5, py: .5, last: -1e9 };
    this.visible = true;
    this.setCanvas = (el) => {
      if (el === this.cv) return;
      this.cv = el;
      if (el && !this.gl) requestAnimationFrame(() => this.boot());
    };
    this.setHero = (el) => { this.hero = el; };
    this.setImg = (el) => { this.img = el; };
    this.setTitle = (el) => { this.title = el; };
    this.setOverlay = (el) => {
      if (el === this.oc) return;
      this.oc = el;
      if (el && this.gl && !this.og) this.bootOverlay();
    };
    this.par = { x: 0, y: 0 };
    this.state = { press: false };
    this.openPress = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ press: true }); };
    this.closePress = (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ press: false }); };
    this.stopPress = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };
    this.onMove = (e) => {
      if (!this.cv) return;
      const r = this.cv.getBoundingClientRect();
      if (!r.width) return;
      this.m.x = (e.clientX - r.left) / r.width;
      this.m.y = 1 - (e.clientY - r.top) / r.height;
      if (performance.now() - this.m.last > 400) { this.m.sx = this.m.px = this.m.x; this.m.sy = this.m.py = this.m.y; }
      this.m.last = performance.now();
    };
  }

  componentDidMount() { if (this.cv && !this.gl) this.boot(); }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
    if (this.gl) { const ext = this.gl.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext(); }
    if (this.og) { const ext2 = this.og.gl.getExtension('WEBGL_lose_context'); if (ext2) ext2.loseContext(); }
    this.og = null;
    this.gl = null;
  }

  hex(h) {
    const s = (h || '#C9A45C').replace('#', '');
    const n = parseInt(s.length === 3 ? s.split('').map(c => c + c).join('') : s, 16);
    return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
  }

  boot() {
    const cv = this.cv;
    if (!cv || this.gl) return;
    const gl = cv.getContext('webgl', { alpha: false, antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: false });
    if (!gl) return;
    this.gl = gl;
    const vs = 'attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
    const common = 'precision mediump float;varying vec2 v;float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}';
    const sim = common + 'uniform sampler2D prev;uniform vec2 a,b,px;uniform float rad,str,decay,t,asp;' +
      'float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float k=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.,1.);return length(pa-ba*k);}' +
      'void main(){vec2 q=v;vec2 o=vec2(n(q*5.+t*.12)-.5,n(q*5.+19.7-t*.1)-.5)*.007;' +
      'float c=texture2D(prev,q+o).r*.52;vec2 s=px*1.6;' +
      'c+=texture2D(prev,q+o+vec2(s.x,0.)).r*.12;c+=texture2D(prev,q+o-vec2(s.x,0.)).r*.12;' +
      'c+=texture2D(prev,q+o+vec2(0.,s.y)).r*.12;c+=texture2D(prev,q+o-vec2(0.,s.y)).r*.12;' +
      'c=c*decay-.0035;vec2 P=vec2(q.x*asp,q.y),A=vec2(a.x*asp,a.y),B=vec2(b.x*asp,b.y);' +
      'float d=seg(P,A,B)+ (n(q*40.+t)-.5)*rad*.35;c+=str*smoothstep(rad,rad*.15,d);gl_FragColor=vec4(clamp(c,0.,1.),0.,0.,1.);}';
    const disp = common + 'uniform sampler2D s,photo;uniform vec3 ink;uniform vec2 px,isc,ioff;uniform float t,multi,ready,dist,zoom;' +
      'void main(){vec2 q=v;float g=texture2D(s,q).r;' +
      'float gx=texture2D(s,q+vec2(px.x*3.,0.)).r-texture2D(s,q-vec2(px.x*3.,0.)).r;' +
      'float gy=texture2D(s,q+vec2(0.,px.y*3.)).r-texture2D(s,q-vec2(0.,px.y*3.)).r;' +
      'vec2 d=vec2(gx,gy);vec3 a=vec3(texture2D(s,q+d*.035).r,g,texture2D(s,q-d*.035).r);a=smoothstep(.04,.85,a);' +
      'float k=fract(n(q*1.6+vec2(t*.07,-t*.05))*1.4+t*.035);' +
      'vec3 c0=vec3(.80,.16,.12),c1=vec3(.12,.62,.55),c2=vec3(.85,.66,.30),c3=vec3(.20,.33,.85);' +
      'float f=k*4.;vec3 pal=f<1.?mix(c0,c1,f):f<2.?mix(c1,c2,f-1.):f<3.?mix(c2,c3,f-2.):mix(c3,c0,f-3.);' +
      'vec3 tint=multi>.5?pal:ink;vec3 col;' +
      'if(ready>.5){vec2 w=vec2(n(q*3.+t*.15)-.5,n(q*3.+7.1-t*.13)-.5)*.004;vec2 dd=d*dist+w+(q-.5)*g*dist*.25;' +
      'vec2 u=(q-.5)*isc/zoom+ioff;' +
      'col=vec3(texture2D(photo,u+dd*1.4).r,texture2D(photo,u+dd).g,texture2D(photo,u+dd*.6).b);' +
      'col=1.-(1.-col)*(1.-tint*a*.8);' +
      'float vg=smoothstep(.35,1.05,length((q-.5)*vec2(1.15,1.)));col*=1.-vg*.55;' +
      'col+=(h(q*vec2(1311.,977.)+fract(t))-.5)*.07;}' +
      'else{col=tint*a*1.05+(h(q*vec2(1311.,977.)+fract(t))-.5)*.08*a.g;}' +
      'gl_FragColor=vec4(col,1.);}';
    const mk = (fs) => {
      const p = gl.createProgram();
      [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
        const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh); gl.attachShader(p, sh);
      });
      gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return null;
      const u = {}; const cnt = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < cnt; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
      return { p, u };
    };
    this.vsSrc = vs; this.simSrc = sim;
    this.ovSrc = common + 'uniform sampler2D s,mk;uniform vec3 ink;uniform float t,multi,on;' +
      'void main(){vec2 q=v;float g=texture2D(s,q).r;vec4 M=texture2D(mk,q);float m=M.r,b=M.g;' +
      'float e=smoothstep(.03,.75,g);' +
      'float k=fract(n(q*1.6+vec2(t*.07,-t*.05))*1.4+t*.035);' +
      'vec3 c0=vec3(.80,.16,.12),c1=vec3(.12,.62,.55),c2=vec3(.85,.66,.30),c3=vec3(.20,.33,.85);' +
      'float f=k*4.;vec3 pal=f<1.?mix(c0,c1,f):f<2.?mix(c1,c2,f-1.):f<3.?mix(c2,c3,f-2.):mix(c3,c0,f-3.);' +
      'vec3 tint=multi>.5?pal:ink;vec3 tb=mix(tint,vec3(1.),.3);' +
      'float hu=fract(dot(q,vec2(1.7,1.1))+t*.06+g*1.2);vec3 pearl=.5+.5*cos(6.2831*(hu+vec3(0.,.33,.67)));' +
      'vec3 pw=mix(vec3(1.),pearl,.28);' +
      'vec3 c=e<.5?mix(tb,pw,e*2.):mix(pw,vec3(1.),(e-.5)*2.);' +
      'float sp=step(.988,h(floor(q*vec2(520.,320.))+floor(t*10.)))*smoothstep(.4,.9,e);c=min(c+sp*.8,vec3(1.));' +
      'float aL=m*smoothstep(0.,.3,e)*on;float aB=b*e*.6*on*(1.-m);vec3 bc=mix(pw,tint,.25);' +
      'gl_FragColor=vec4(c*aL+bc*aB,clamp(aL+aB,0.,1.));}';
    this.simP = mk(sim); this.dispP = mk(disp);
    if (!this.simP || !this.dispP) { this.gl = null; return; }
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.io = new IntersectionObserver((es) => { this.visible = es[0].isIntersecting; }, { threshold: 0 });
    this.io.observe(cv);
    this.cur = 0;
    this.bootAt = performance.now();
    this.m.sx = this.m.px = .06; this.m.sy = this.m.py = .3;
    this.loadPhoto();
    this.bootOverlay();
    const loop = (t) => { this.raf = requestAnimationFrame(loop); this.frame(t); };
    this.raf = requestAnimationFrame(loop);
  }

  loadPhoto() {
    const gl = this.gl, src = this.img && this.img.getAttribute('src');
    if (!gl || !src) return;
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => {
      if (!this.gl) return;
      try {
        const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
        [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
        if (gl.getError() !== gl.NO_ERROR) throw new Error('tex');
        this.photo = tx; this.iw = im.naturalWidth; this.ih = im.naturalHeight; this.photoAt = performance.now();
      } catch (e) { this.photo = null; }
    };
    im.src = src;
  }

  mkProg(gl, fs) {
    const p = gl.createProgram();
    [[gl.VERTEX_SHADER, this.vsSrc], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
      const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh); gl.attachShader(p, sh);
    });
    gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return null;
    const u = {}; const cnt = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < cnt; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
    return { p, u };
  }

  bootOverlay() {
    const oc = this.oc;
    if (!oc || this.og || !this.vsSrc) return;
    const gl = oc.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
    if (!gl) return;
    const o = { gl, cur: 0, fc: 0 };
    o.simP = this.mkProg(gl, this.simSrc); o.outP = this.mkProg(gl, this.ovSrc);
    if (!o.simP || !o.outP) return;
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.og = o;
  }

  ovTargets(o, w, h) {
    const gl = o.gl;
    (o.tx || []).forEach(x => { gl.deleteTexture(x.t); gl.deleteFramebuffer(x.f); });
    o.tx = [0, 1].map(() => {
      const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
      [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
      const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      return { t, f };
    });
    o.simW = w; o.simH = h;
  }

  buildMask(W, H) {
    const o = this.og, el = this.title, oc = this.oc;
    if (!o || !el || !oc) return;
    if (document.fonts && document.fonts.status !== 'loaded') return;
    const r = el.getBoundingClientRect(), c = oc.getBoundingClientRect();
    if (!c.width || !r.width) return;

  makeTargets(w, h) {

  frame(t) {

    const trail = props.trail ?? .6;

    const src = this.tx[this.cur], dst = this.tx[1 - this.cur];
