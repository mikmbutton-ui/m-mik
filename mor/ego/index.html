<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="M’Or EGO · Alter Ego Chapter 01. What We Hide. What We Reveal.">
<meta property="og:title" content="M’Or EGO · Alter Ego Chapter 01">
<meta property="og:description" content="What We Hide. What We Reveal.">
<meta property="og:image" content="https://m-mik.com/assets/mor/ego-wide.jpg">
<link rel="preload" as="image" href="/assets/mor/ego-wide.jpg">
<title>M’Or Alter Ego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..600&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}img{max-width:100%}
/* Layout: one dark stage. The masque image sits almost invisible; a soft lamp under the pointer reveals the gold. Labels hold the four corners. */
:root{
  --night:#000000;
  --ghost:#2A241B;
  --gold:#D9B56A;
  --gold-soft:#B89656;
  --ivory:#EDE6D6;
  --mute:#8A7F6C;
  --f-label:'Archivo',system-ui,sans-serif;
  --f-serif:'Cormorant Garamond','Times New Roman',serif;
  --f-kr:'Noto Serif KR','Apple SD Gothic Neo',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ivory);overflow:hidden;font-family:var(--f-label);-webkit-font-smoothing:antialiased;cursor:none;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:fixed;inset:0;background:var(--night)}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;max-width:none;pointer-events:none}
.base{filter:grayscale(.5) brightness(.09)}
.lit{-webkit-mask-image:var(--m);mask-image:var(--m);filter:saturate(1.08) contrast(1.04)}
.glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:var(--g);opacity:.9}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.cursor{position:fixed;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px 4px rgba(217,181,106,.55);pointer-events:none;transition:width .4s,height .4s,margin .4s,opacity .4s;z-index:5}
.cursor.down{width:4px;height:4px;margin:-2px 0 0 -2px}

.frame{position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
  padding-block:0 max(26px,env(safe-area-inset-bottom,0px));
  padding-left:max(26px,env(safe-area-inset-left,0px));padding-right:max(26px,env(safe-area-inset-right,0px))}
.line{margin:0;min-width:0;font-family:var(--f-kr);font-weight:300;font-size:15px;line-height:1.85;letter-spacing:.02em;color:var(--ivory);opacity:.86;transition:opacity .5s}
.line[lang="en"]{font-family:var(--f-serif);font-style:italic;font-size:19px;line-height:1.45;letter-spacing:0}
.line.swap{opacity:0}
.lang{pointer-events:auto;display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.24em;color:var(--mute);font-stretch:110%}
.lang button{all:unset;cursor:pointer;padding:6px 2px;color:var(--mute);transition:color .3s}
.lang button[aria-pressed="true"]{color:var(--gold)}
.lang button:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.hint{position:fixed;left:50%;top:max(28px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:4;pointer-events:none;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);transition:opacity 1.2s;white-space:nowrap}
.hint.gone{opacity:0}
.intro{position:fixed;inset:0;background:var(--night);z-index:6;pointer-events:none;animation:intro 2.4s cubic-bezier(.6,0,.2,1) .2s forwards}
@keyframes intro{to{opacity:0}}
@media (max-width:640px){.line{font-size:13px}.line[lang="en"]{font-size:16px}}
@media (hover:none){body{cursor:auto}.cursor{display:none}}
@media (prefers-reduced-motion:reduce){.grain,.intro{animation:none}.intro{display:none}}
</style>

</head>
<body>
<main class="stage" id="stage" aria-label="M’Or EGO, Alter Ego Chapter 01 teaser. Move the pointer to reveal the image.">
  <img class="layer base" id="base" alt="">
  <img class="layer lit" id="lit" alt="Gold Venetian mask seen through the words What we hide. What we reveal.">
  <div class="glow" id="glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
</main>
<div class="cursor" id="cursor" aria-hidden="true"></div>

<div class="frame">
  <p class="line" id="line" lang="ko">우리는 감추기 위해 장식하고,<br>드러내기 위해 감춘다.</p>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="lang-ko" data-l="ko" aria-pressed="true">KR</button>
    <span aria-hidden="true">/</span>
    <button type="button" id="lang-en" data-l="en" aria-pressed="false">EN</button>
  </div>
</div>
<p class="hint" id="hint">길게 눌러 드러내기</p>
<div class="intro" aria-hidden="true"></div>

<script>
(() => {
  const WIDE = "/assets/mor/ego-wide.jpg", TALL = "/assets/mor/ego-tall.jpg";
  const SIZES = { wide:[1672,941], tall:[1086,1448] };
  const stage = document.getElementById('stage'), base = document.getElementById('base'), lit = document.getElementById('lit');
  const glow = document.getElementById('glow'), cur = document.getElementById('cursor'), hint = document.getElementById('hint'), meter = null;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let kind = '';
  function pick(){
    const k = innerWidth / innerHeight < 1 ? 'tall' : 'wide';
    if (k !== kind){ kind = k; base.src = lit.src = k === 'wide' ? WIDE : TALL; }
  }
  pick(); addEventListener('resize', pick);

  // image box under object-fit: contain, used for the idle path
  function box(){
    const [iw, ih] = SIZES[kind], s = Math.min(innerWidth / iw, innerHeight / ih);
    const w = iw * s, h = ih * s; return { x:(innerWidth - w) / 2, y:(innerHeight - h) / 2, w, h };
  }

  let tx = innerWidth * .5, ty = innerHeight * .42, x = tx, y = ty;
  let active = false, lastMove = -1e9, down = false, hold = 0, holdV = 0, t0 = performance.now(), hinted = false;

  function move(e){
    tx = e.clientX; ty = e.clientY; lastMove = performance.now(); active = true;
    cur.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    if (!hinted && performance.now() - t0 > 2500){ hinted = true; setTimeout(() => hint.classList.add('gone'), 2200); }
  }
  addEventListener('pointermove', move, { passive:true });
  addEventListener('pointerdown', e => { move(e); down = true; cur.classList.add('down'); });
  addEventListener('pointerup', () => { down = false; cur.classList.remove('down'); });
  addEventListener('pointercancel', () => { down = false; cur.classList.remove('down'); });
  document.addEventListener('pointerleave', () => { active = false; });
  addEventListener('blur', () => { down = false; });

  function frame(now){
    const idle = !active || now - lastMove > 3200;
    if (idle){
      // slow drift across the mask, a lamp searching in the dark
      const b = box(), t = (now - t0) / 1000;
      tx = b.x + b.w * (.5 + .28 * Math.sin(t * .23) + .06 * Math.sin(t * .71));
      ty = b.y + b.h * (.45 + .2 * Math.sin(t * .17 + 1.3));
    }
    const k = reduce ? 1 : (idle ? .025 : .14);
    x += (tx - x) * k; y += (ty - y) * k;

    hold += ((down ? 1 : 0) - hold) * (down ? .018 : .06);
    holdV = hold < .002 ? 0 : hold;
    const m = Math.min(innerWidth, innerHeight);
    const R = m * (innerWidth < 640 ? .30 : .24) * (1 + holdV * 4.2) + Math.sin(now / 900) * 4;
    lit.style.setProperty('--m', 'radial-gradient(circle ' + R + 'px at ' + x + 'px ' + y + 'px, #000 0%, #000 34%, rgba(0,0,0,.55) 58%, rgba(0,0,0,.12) 82%, transparent 100%)');
    glow.style.setProperty('--g', 'radial-gradient(circle ' + (R * .55) + 'px at ' + x + 'px ' + y + 'px, rgba(255,214,140,' + (.16 - holdV * .1) + ') 0%, rgba(217,181,106,0) 100%)');
    
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const TXT = {
    ko:{ line:'우리는 감추기 위해 장식하고,<br>드러내기 위해 감춘다.', hint:'길게 눌러 드러내기' },
    en:{ line:'We adorn to conceal,<br>and conceal to reveal.', hint:'Press and hold to reveal' }
  };
  const line = document.getElementById('line');
  function setLang(l, instant){
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === l)));
    document.documentElement.lang = l;
    const apply = () => { line.innerHTML = TXT[l].line; line.lang = l; hint.textContent = TXT[l].hint; line.classList.remove('swap'); };
    if (instant) apply(); else { line.classList.add('swap'); setTimeout(apply, 350); }
    try { localStorage.setItem('mor-lang', l); } catch (e) {}
  }
  document.querySelectorAll('.lang button').forEach(b => {
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.addEventListener('click', () => setLang(b.dataset.l));
  });
  let saved = null; try { saved = localStorage.getItem('mor-lang'); } catch (e) {}
  if (saved === 'en') setLang('en', true);
})();
</script>

</body>
</html>
